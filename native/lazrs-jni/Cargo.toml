[package]
name = "lazrs_jni"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Optional Android JNI decoder: laz-rs parallel chunk decompression into a packed xyz buffer."

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"
rayon = "=1.11.0"
# 0.8.8 ships laz-parallel and builds on rustc 1.83. Newer las 0.9.x needs edition2024.
las = { version = "=0.8.8", features = ["laz-parallel"] }
laz = { version = "=0.9.2", features = ["parallel"] }
# las 0.8 pulls uuid ^1; latest uuid needs rustc 1.89.
uuid = "=1.11.0"

[profile.release]
lto = true
codegen-units = 1
