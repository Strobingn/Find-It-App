name: Find-it-appAPK

# Tests and emulator smoke checks run for the branches below.
# Pushes, including CODEX-ERROR-CHECK, publish a signed APK release after all checks pass.
on:
  push:
    branches: [main, "perf-*", "jules-*", "perf-historicmapcatalogclient-thread-sleep", CODEX-ERROR-CHECK]
  pull_request:
    branches: [main, "perf-*", "jules-*", "perf-historicmapcatalogclient-thread-sleep", CODEX-ERROR-CHECK]
  workflow_dispatch:

env:
  APPLICATION_ID: com.aistudio.lidardetector.pkrxtz

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create local.properties before Gradle setup
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'XAI_API_KEY=%s\n' "$XAI_API_KEY"
            printf 'GROK_MODEL=%s\n' "${GROK_MODEL:-grok-4.7}"
            printf 'GROK_REASONING_EFFORT=%s\n' "${GROK_REASONING_EFFORT:-medium}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Require Gradle wrapper
        run: |
          test -f gradlew || { echo "gradlew missing on this branch"; ls -la; exit 1; }
          chmod +x ./gradlew

      - name: Ensure .env for secrets plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Use committed debug keystore
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-configuration-cache 2>&1 | tee unit-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log-${{ github.run_number }}
          path: unit-test.log
          if-no-files-found: warn
          retention-days: 14


  # Opens every screen of the real app on an emulator with Google Play services. A screen that
  # crashes on open fails this job, and no APK is built from that commit.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create local.properties
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'XAI_API_KEY=%s\n' "$XAI_API_KEY"
            printf 'GROK_MODEL=%s\n' "${GROK_MODEL:-grok-4.7}"
            printf 'GROK_REASONING_EFFORT=%s\n' "${GROK_REASONING_EFFORT:-medium}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure .env for secrets plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Use committed debug keystore
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore
          chmod +x ./gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open every screen on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.AppSmokeTest --stacktrace --no-configuration-cache || (adb logcat -d > smoke-logcat.txt; exit 1)

      - name: Upload crash log and test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-${{ github.run_number }}
          path: |
            smoke-logcat.txt
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/findit-release.jks"
            test -s "$GITHUB_WORKSPACE/findit-release.jks"
            echo "path=$GITHUB_WORKSPACE/findit-release.jks" >> "$GITHUB_OUTPUT"
            echo "mode=release-secret" >> "$GITHUB_OUTPUT"
            echo "Using repository release keystore secrets"
          else
            echo "path=$GITHUB_WORKSPACE/ci/findit-debug.keystore" >> "$GITHUB_OUTPUT"
            echo "mode=committed-debug" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_* secrets; signing with committed ci/findit-debug.keystore"
          fi

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'XAI_API_KEY=%s\n' "$XAI_API_KEY"
            printf 'GROK_MODEL=%s\n' "${GROK_MODEL:-grok-4.7}"
            printf 'GROK_REASONING_EFFORT=%s\n' "${GROK_REASONING_EFFORT:-medium}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          CODE=$((1000000 + ${{ github.run_number }}))
          NAME="2.0.${{ github.run_number }}"
          TAG="findit-v${CODE}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure .env for secrets plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Build signed release APK
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$SIGNING_MODE" = "release-secret" ]; then
            export STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            export STORE_PASSWORD=android
            export KEY_ALIAS=androiddebugkey
            export KEY_PASSWORD=android
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-configuration-cache
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          DEST="$GITHUB_WORKSPACE/findit-${{ steps.version.outputs.code }}.apk"
          cp "$APK" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" | awk '{print $1}' > "$GITHUB_WORKSPACE/findit.sha256"
          echo "sha256=$(cat "$GITHUB_WORKSPACE/findit.sha256")" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          SHA: ${{ steps.apk.outputs.sha256 }}
          APK: ${{ steps.apk.outputs.apk }}
          TOKEN_EXPIRY: ${{ vars.FINDIT_UPDATE_TOKEN_EXPIRY }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$SIGNING_MODE" = "release-secret" ]; then
            SIGN_NOTE="Signed with the optional repository release keystore secrets."
          else
            SIGN_NOTE="Signed with the committed CI debug keystore (ci/findit-debug.keystore). Future findit-v* APKs use this same key."
          fi
          NOTES=$(cat <<EOF
          Find It Android build ${NAME} (${CODE})

          app-id: ${APPLICATION_ID}
          version-code: ${CODE}
          sha256: ${SHA}
          update-token-expiry: ${TOKEN_EXPIRY:-optional}

          ${SIGN_NOTE}
          EOF
          )
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Find It $NAME" \
            --notes "$NOTES" \
            "$APK"
          BODY=$(gh release view "$TAG" --json body --jq .body)
          echo "$BODY" | grep -F "app-id: ${APPLICATION_ID}" >/dev/null \
            || { echo "::error::Release notes missing app-id line"; exit 1; }
          echo "$BODY" | grep -Eq 'sha256: [0-9a-f]{64}' \
            || { echo "::error::Release notes missing sha256"; exit 1; }
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.apk$' >/dev/null \
            || { echo "::error::Release missing APK asset"; exit 1; }
          echo "First-release style URL: https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "$APK")"

  # PR / manual runs: upload an APK artifact without a GitHub Release.
  apk-preview:
    if: github.event_name != 'push'
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use committed debug keystore
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'MAPBOX_ACCESS_TOKEN=%s\n' "$MAPBOX_ACCESS_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'XAI_API_KEY=%s\n' "$XAI_API_KEY"
            printf 'GROK_MODEL=%s\n' "${GROK_MODEL:-grok-4.7}"
            printf 'GROK_REASONING_EFFORT=%s\n' "${GROK_REASONING_EFFORT:-medium}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"
          touch .env

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK (signed with committed debug keystore)
        env:
          STORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION_CODE=$((1000000 + RUN_NUMBER))
          export VERSION_NAME="2.0.${RUN_NUMBER}-preview"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-configuration-cache
          mkdir -p out
          cp $(find app/build/outputs/apk/release -name '*.apk' | head -n 1) out/findit-preview-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: findit-preview-apk
          path: out/*.apk
          if-no-files-found: error
