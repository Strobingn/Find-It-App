name: Find-it-appAPK

# Main publishes stable releases. The LAZ fix branch builds an installable APK artifact.
on:
  push:
    branches: [main, 'fix/laz-precision-performance-20261014']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APPLICATION_ID: com.aistudio.lidardetector.pkrxtz

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create local.properties before Gradle setup
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache native toolchain artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native/lazrs-jni/target
          key: native-laz-${{ runner.os }}-${{ hashFiles('native/lazrs-jni/Cargo.lock', 'native/lazrs-jni/Cargo.toml') }}-v2

      - name: Build and test native LAZ decoder
        shell: bash
        run: |
          set -euo pipefail
          cd native/lazrs-jni
          cargo test --locked
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager 'ndk;28.2.13676358'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo ndk -p 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release --locked
          test -s ../../app/src/main/jniLibs/arm64-v8a/liblazrs_jni.so

      - name: Preserve native libraries for main release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: native-laz-release
          path: app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 1

      - name: Require Gradle wrapper
        run: |
          test -f gradlew || { echo "gradlew missing on this branch"; ls -la; exit 1; }
          chmod +x ./gradlew

      - name: Ensure .env for secrets plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Use committed debug keystore
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --no-configuration-cache 2>&1 | tee unit-test.log

      - name: Enable emulator acceleration
        if: github.event_name != 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate native and GPU paths on Android
        if: github.event_name != 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --no-configuration-cache -Pandroid.testInstrumentationRunnerArguments.class=com.example.data.TerrainGpuInstrumentedTest

      - name: Build branch APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          VERSION_NAME: 2.0.${{ github.run_number }}-laz
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((1000000 + ${{ github.run_number }}))
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/findit-release.jks"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/findit-release.jks"
          else
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/ci/findit-debug.keystore"
            export STORE_PASSWORD=android KEY_ALIAS=androiddebugkey KEY_PASSWORD=android
          fi
          ./gradlew assembleRelease --stacktrace --no-configuration-cache
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/liblazrs_jni.so'
          (cd app/build/outputs/apk/release && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload branch APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: Find-It-LAZ-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-log-${{ github.run_number }}
          path: |
            unit-test.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore native LAZ libraries
        uses: actions/download-artifact@v7
        with:
          name: native-laz-release
          path: app/src/main/jniLibs/

      - name: Resolve signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -s ci/findit-debug.keystore
          mkdir -p "$HOME/.android"
          cp -f ci/findit-debug.keystore "$HOME/.android/debug.keystore"
          cp -f ci/findit-debug.keystore debug.keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/findit-release.jks"
            test -s "$GITHUB_WORKSPACE/findit-release.jks"
            echo "path=$GITHUB_WORKSPACE/findit-release.jks" >> "$GITHUB_OUTPUT"
            echo "mode=release-secret" >> "$GITHUB_OUTPUT"
            echo "Using repository release keystore secrets"
          else
            echo "path=$GITHUB_WORKSPACE/ci/findit-debug.keystore" >> "$GITHUB_OUTPUT"
            echo "mode=committed-debug" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_* secrets; signing with committed ci/findit-debug.keystore"
          fi

      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_PROXY_TOKEN: ${{ secrets.OPENAI_PROXY_TOKEN }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FINDIT_UPDATE_TOKEN: ${{ secrets.FINDIT_UPDATE_TOKEN }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_PROXY_TOKEN=%s\n' "$OPENAI_PROXY_TOKEN"
            printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://api.openai.com/v1/responses}"
            printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.2}"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-3.5-flash}"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'FINDIT_UPDATE_TOKEN=%s\n' "$FINDIT_UPDATE_TOKEN"
          } > "$GITHUB_WORKSPACE/local.properties"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version
        id: version
        run: |
          CODE=$((1000000 + ${{ github.run_number }}))
          NAME="2.0.${{ github.run_number }}"
          TAG="findit-v${CODE}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure .env for secrets plugin
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          touch .env

      - name: Build signed release APK
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "$SIGNING_MODE" = "release-secret" ]; then
            export STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export KEY_ALIAS="$RELEASE_KEY_ALIAS"
            export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            export STORE_PASSWORD=android
            export KEY_ALIAS=androiddebugkey
            export KEY_PASSWORD=android
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-configuration-cache
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/liblazrs_jni.so'
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          DEST="$GITHUB_WORKSPACE/findit-${{ steps.version.outputs.code }}.apk"
          cp "$APK" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST" | awk '{print $1}' > "$GITHUB_WORKSPACE/findit.sha256"
          echo "sha256=$(cat "$GITHUB_WORKSPACE/findit.sha256")" >> "$GITHUB_OUTPUT"
        id: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          SHA: ${{ steps.apk.outputs.sha256 }}
          APK: ${{ steps.apk.outputs.apk }}
          TOKEN_EXPIRY: ${{ vars.FINDIT_UPDATE_TOKEN_EXPIRY }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$SIGNING_MODE" = "release-secret" ]; then
            SIGN_NOTE="Signed with the optional repository release keystore secrets."
          else
            SIGN_NOTE="Signed with the committed CI debug keystore (ci/findit-debug.keystore). Future findit-v* APKs use this same key."
          fi
          NOTES=$(cat <<EOF
          Find It Android build ${NAME} (${CODE})

          app-id: ${APPLICATION_ID}
          version-code: ${CODE}
          sha256: ${SHA}
          update-token-expiry: ${TOKEN_EXPIRY:-optional}

          ${SIGN_NOTE}
          EOF
          )
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Find It $NAME" \
            --notes "$NOTES" \
            "$APK"
          BODY=$(gh release view "$TAG" --json body --jq .body)
          echo "$BODY" | grep -F "app-id: ${APPLICATION_ID}" >/dev/null \
            || { echo "::error::Release notes missing app-id line"; exit 1; }
          echo "$BODY" | grep -Eq 'sha256: [0-9a-f]{64}' \
            || { echo "::error::Release notes missing sha256"; exit 1; }
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '\.apk$' >/dev/null \
            || { echo "::error::Release missing APK asset"; exit 1; }
          echo "First-release style URL: https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "$APK")"
