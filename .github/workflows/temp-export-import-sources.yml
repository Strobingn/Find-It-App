name: Temp export import sources

on:
  push:
    branches:
      - agent/faster-laz-decode
    paths:
      - .github/workflows/temp-export-import-sources.yml
      - app/src/main/java/com/example/ui/components/CustomFileLoader.kt
      - app/src/main/java/com/example/ui/components/NysLazTilePicker.kt

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v7
        with:
          name: import-source-files
          path: |
            app/src/main/java/com/example/ui/components/CustomFileLoader.kt
            app/src/main/java/com/example/ui/components/NysLazTilePicker.kt
          if-no-files-found: error
          retention-days: 1
