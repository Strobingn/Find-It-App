name: CODEX error check

on:
  push:
    branches: [CODEX-ERROR-CHECK]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure local build
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          touch .env
          chmod +x gradlew
      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-error-check-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
