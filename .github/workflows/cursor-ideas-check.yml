name: Cursor ideas integration checks

on:
  push:
    branches: [chatgpt/cursor-ideas-20261017]
  pull_request:
    paths:
      - backend/cursor-ideas/**
      - app/src/main/java/com/example/cursor/**
      - app/src/main/java/com/example/ui/CursorIdeasDialog.kt
      - .github/workflows/cursor-ideas-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cursor-ideas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: backend/cursor-ideas

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Test integration and build branch APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.example.cursor.*' assembleDebug --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: findit-cursor-ideas-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
